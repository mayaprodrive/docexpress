<style>

    {id:"convention-partenariat",label:"Convention de partenariat",fields:["structure1","siret1","referent1","adresse1","structure2","siret2","referent2","adresse2","objet_partenariat","apports_s1","apports_s2","duree","date"]},
    {id:"devis",label:"Devis commercial",fields:["prestataire","siret_presta","adresse_prestataire","client","adresse_client","prestations","montant_ht","tva","remise","validite","date"]},
    {id:"facture",label:"Facture",fields:["prestataire","siret_presta","adresse_prestataire","client","adresse_client","numero_facture","date","prestations","montant_ht","tva","echeance"]},
    {id:"mise-en-demeure",label:"Lettre de mise en demeure",fields:["expediteur","adresse_exp","destinataire","adresse_dest","objet_litige","montant","reference","delai","date"]},
    {id:"pv-ag",label:"Procès-verbal d'AG",fields:["nom_asso","adresse_asso","date_ag","lieu","president_seance","secretaire","nb_membres_presents","ordre_du_jour","decisions"]},

  ]},
  {id:"risque-routier",icon:"🦺",label:"Risque Routier Professionnel",color:T.green,
   desc:"Outils pour RH, DRH et responsables sécurité en entreprise",
   docs:[

    {id:"fiche-conducteur",label:"Fiche individuelle conducteur",fields:["nom_entreprise","nom_salarie","prenom_salarie","poste","service","permis_categorie","date_permis","points_permis","vehicule_attribue","km_annuels"]},

    {id:"analyse-risque",label:"Fiche d'analyse des risques routiers",fields:["nom_entreprise","service","responsable","trajet_type","frequence","niveau_risque","causes_identifiees","mesures","echeance"]},

    {id:"pv-age",label:"PV d'Assemblée Générale Extraordinaire",fields:["nom_asso","adresse_siege","date_ag","heure_ag","lieu_ag","president_seance","secretaire_seance","membres_presents","objet_age","modifications","votes_pour","votes_contre","abstentions","decisions","lieu_signature","president_nom","secretaire_nom"]},
    {id:"liste-membres-bureau",label:"Liste des membres du bureau",fields:["nom_asso","adresse_siege","telephone","email","periode_mandat","membre1_titre","membre1_nom","membre1_prenom","membre1_naissance","membre1_lieu_naissance","membre1_nationalite","membre1_adresse","membre1_cp_ville","membre1_profession","membre1_telephone","membre1_email","membre1_qualite","membre2_titre","membre2_nom","membre2_prenom","membre2_naissance","membre2_lieu_naissance","membre2_nationalite","membre2_adresse","membre2_cp_ville","membre2_profession","membre2_telephone","membre2_email","membre2_qualite","membre3_titre","membre3_nom","membre3_prenom","membre3_adresse","membre3_cp_ville","membre3_profession","membre3_telephone","membre3_email","membre3_qualite","lieu_signature","date_signature","president_nom","secretaire_nom"]},

    {id:"bulletin-adhesion",label:"Bulletin d'adhésion",fields:["nom_asso","annee","nom_adherent","prenom_adherent","date_naissance_a","adresse_adherent","email","telephone_adherent","montant_adhesion","montant_cotisation_actif","type_membre"]},
    {id:"ri-asso",label:"Règlement intérieur",fields:["nom_asso","date_adoption","president","secretaire","modalites_adhesion","montant_adhesion","montant_cotisation","droit_vote","discipline","lieu_signature"]},
  ]},
];

function genDoc(doc,fields,poleLabel){
  const today=new Date().toLocaleDateString("fr-FR");
  const g=k=>fields[k]||`[${k.replace(/_/g,' ')}]`;
  const sep="─".repeat(52);
  const tpl={
    "contrat-eleve":`CONTRAT DE FORMATION À LA CONDUITE — PERMIS B\n${sep}\n\nAUTO-ÉCOLE\n${g("nom_ecole")} — SIRET : ${g("siret_ecole")}\n${g("adresse_ecole")}\nMoniteur : ${g("moniteur")}\n\nÉLÈVE\n${g("prenom_eleve")} ${g("nom_eleve")} — Né(e) le ${g("date_naissance")}\n${g("adresse_eleve")} — Tél : ${g("telephone_eleve")}\n\nFORMATION\nFormule : ${g("formule")} | Heures : ${g("nb_heures")}h | Montant : ${g("montant")}€\nModalités de paiement : ${g("modalite_paiement")}\n\nARTICLES\nArt.1 – L'auto-école dispense la formation théorique et pratique convenue.\nArt.2 – L'élève respecte le règlement intérieur et les créneaux réservés.\nArt.3 – Toute annulation doit être signalée 48h à l'avance.\nArt.4 – En cas de résiliation, les heures non effectuées sont remboursées.\n\n${sep}\nFait le ${today}\n\nSignature élève :                 Signature moniteur :`,
    "recu-paiement":`REÇU DE PAIEMENT N° ${g("numero_recu")}\n${sep}\n\nAuto-école : ${g("nom_ecole")}\nDate : ${g("date")||today}\n\nJe soussigné(e) ${g("moniteur")} reconnais avoir reçu de :\n${g("prenom_eleve")} ${g("nom_eleve")}\n\nLa somme de : ${g("montant")} €\nPar : ${g("mode_paiement")}\nAu titre de : ${g("objet")}\n\n${sep}\nSignature et cachet :`,
    "attestation-heures":`ATTESTATION D'HEURES DE CONDUITE\n${sep}\n\nJe soussigné(e) ${g("moniteur")}, moniteur de conduite\nde l'auto-école ${g("nom_ecole")},\n\natteste que ${g("prenom_eleve")} ${g("nom_eleve")}\na effectué ${g("nb_heures")} heures de conduite\ndu ${g("date_debut")} au ${g("date_fin")}.\nType de formation : ${g("type_formation")}\n\nDélivrée pour faire valoir ce que de droit.\n${sep}\nFait le ${today}\n\nSignature et cachet :`,
    "contrat-prestation":`CONTRAT DE PRESTATION DE SERVICES\n${sep}\n\nPRESTATAIRE : ${g("prestataire")}\nSIRET : ${g("siret_presta")} | ${g("adresse_prestataire")}\n\nCLIENT : ${g("client")}\nSIRET : ${g("siret_client")} | ${g("adresse_client")}\n\nArt.1 – OBJET\n${g("objet_mission")}\n\nArt.2 – DURÉE\nDébut : ${g("date_debut")} — Durée : ${g("duree")}\n\nArt.3 – RÉMUNÉRATION\nMontant HT : ${g("montant_ht")}€ | TVA ${g("tva")}% : ${(parseFloat(fields.montant_ht||0)*parseFloat(fields.tva||0)/100).toFixed(2)}€\nTTC : ${(parseFloat(fields.montant_ht||0)*(1+parseFloat(fields.tva||0)/100)).toFixed(2)}€\nModalités : ${g("modalites_paiement")}\n\nArt.4 – CONFIDENTIALITÉ\nChaque partie s'engage à la stricte confidentialité.\n\nArt.5 – PÉNALITÉS\n${g("penalites")}\n\n${sep}\nFait en deux exemplaires, le ${today}\n\nSignature Prestataire :           Signature Client :`,
    "facture":`FACTURE N° ${g("numero_facture")}\n${sep}\n\n${g("prestataire")} — SIRET : ${g("siret_presta")}\n${g("adresse_prestataire")}\n\nFacturé à : ${g("client")} — ${g("adresse_client")}\nDate : ${g("date")||today} | Échéance : ${g("echeance")}\n\nDÉTAIL DES PRESTATIONS\n${sep}\n${g("prestations")}\n${sep}\nMontant HT     : ${g("montant_ht")} €\nTVA (${g("tva")}%)    : ${(parseFloat(fields.montant_ht||0)*parseFloat(fields.tva||0)/100).toFixed(2)} €\nTOTAL TTC      : ${(parseFloat(fields.montant_ht||0)*(1+parseFloat(fields.tva||0)/100)).toFixed(2)} €\n${sep}\nEn cas de retard : pénalités 3x taux légal + 40€ d'indemnité.`,
    "nda":`ACCORD DE CONFIDENTIALITÉ (NDA)\n${sep}\n\nEntre ${g("partie1")} (${g("adresse_p1")})\nET ${g("partie2")} (${g("adresse_p2")})\n\nArt.1 – OBJET : ${g("objet_confidentiel")}\n\nArt.2 – OBLIGATIONS\nChaque partie s'engage à ne pas divulguer les informations\néchangées et à les utiliser uniquement dans le cadre défini.\n\nArt.3 – DURÉE : ${g("duree_nda")}\n\nArt.4 – JURIDICTION : ${g("juridiction")}\n\n${sep}\nFait le ${g("date")||today}\n\nSignature ${g("partie1")} :         Signature ${g("partie2")} :`,
    "charte-conducteur":`CHARTE DU CONDUCTEUR RESPONSABLE\n${sep}\n${g("nom_entreprise").toUpperCase()}\n\nEn tant que conducteur professionnel, je m'engage à :\n\n✓ Respecter scrupuleusement le Code de la Route\n✓ Ne jamais téléphoner en conduisant\n✓ Ne jamais conduire sous l'emprise d'alcool ou de drogues\n✓ Adapter ma vitesse aux conditions de circulation\n✓ Porter systématiquement la ceinture de sécurité\n✓ Respecter les temps de repos réglementaires\n✓ Signaler tout défaut mécanique immédiatement\n✓ Refuser de conduire en état de fatigue\n✓ Effectuer la vérification du véhicule avant départ\n\nJe reconnais avoir pris connaissance de la politique\nde sécurité routière de l'entreprise.\n\n${sep}\nEntreprise : ${g("nom_entreprise")} | Direction : ${g("directeur")}\nResponsable sécurité : ${g("responsable_securite")}\nFait le ${g("date")||today}\n\nNom & signature du conducteur :    Date :`,
    "statuts-asso":`STATUTS\n${g("annee_statuts")||today.split('/')[2]}\n${"─".repeat(60)}\n\nArticle I – Constitution et dénomination\nIl est fondé entre les adhérents aux présents statuts une\nassociation régie par la loi du 1er juillet 1901 et le décret\ndu 16 août 1901, ayant pour titre :\n\n« ${g("nom_asso")} »\n\nArticle II – Objet\n${g("objet")}\n\nToutes actions concourant à la réalisation de ces buts.\n\nArticle III – Siège social\nLe siège social est fixé à ${g("siege_social")}\nIl pourra être transféré par décision du conseil d'administration.\n\nArticle IV – Durée de l'association\nLa durée de l'association est illimitée.\n\nArticle V – Moyens d'actions\nLes moyens d'actions de l'association sont notamment :\n- La publication par conférences, séminaires et réunions de travail\n- La diffusion par tous les moyens de communication\n- L'organisation de manifestations et de toutes initiatives\n  pouvant aider à la réalisation de l'objet de l'association\n- La mise en œuvre des projets d'actions avec des partenaires\n- La vente permanente ou occasionnelle de tous services et produits\n  entrant dans le cadre de son objet\n- Création et gestion de fonds pour financer des œuvres sociales\n  ou collectives en lien avec son objet\n\nArticle VI – Ressources de l'association\nLes ressources de l'association se composent :\n➢ des cotisations ; des subventions éventuelles de l'État,\n  des régions, des départements, des communes, des établissements\n  publics, d'associations ou de fondations ;\n➢ des recettes provenant de la vente de produits, de services\n  ou de prestations, des manifestations organisées,\n  des dons financiers ou en nature ;\n➢ du revenu des biens et valeurs appartenant à l'association.\n\nArticle VII – Composition de l'association\nL'association se compose de :\n● Membres fondateurs : sont les personnes à l'initiative\n  de la création, ils assurent la présidence du CA.\n  - ${g("membre_fondateur_1")}\n  - ${g("membre_fondateur_2")}\n● Adhérents : à jour de leur cotisation annuelle.\n● Membres actifs : à jour de leur cotisation, organisent\n  et participent activement. Droit de vote et peuvent se\n  présenter au CA lors des AG.\n● Membres d'honneur : ont rendu des services signalés.\n  Dispensés de cotisation. Pas de droit de vote en AG.\n\nArticle VIII – Admission et adhésion\nLe demandeur adresse une demande motivée soumise au bureau\nqui statue. Il adhère aux présents statuts et s'acquitte de\nla cotisation fixée par l'AG. Le CA peut refuser des\nadhésions sans obligation d'avis motivé.\n\nArticle IX – Assemblée Générale Ordinaire\nL'AGO se réunit au moins une fois par an à la date\nanniversaire de l'association. Convocation 15 jours avant\npar écrit avec ordre du jour. Elle délibère sur le rapport\nmoral, les comptes, les orientations. Elle renouvelle les\nmembres du CA et fixe les cotisations annuelles.\nDécisions à la majorité des membres présents.\n\nArticle X – Assemblée Générale Extraordinaire\nConvoquée si besoin ou sur demande du quart des membres.\nOrdre du jour : modification des statuts ou dissolution.\nDélibérations à la majorité des deux tiers des présents.\n\nArticle XI – Dissolution\nEn cas de dissolution par AGE, un ou plusieurs liquidateurs\nsont nommés. L'actif est dévolu à une association ayant\ndes buts similaires, conformément à l'article 9 de la loi\ndu 1er juillet 1901. En aucun cas les membres ne pourront\nse voir attribuer un bien de l'association.\nRésolutions prises à la moitié des deux tiers des présents.\nVote à main levée sauf demande de vote secret.\n\nArticle XII – Conseil d'Administration\nL'association est dirigée par un CA composé des deux\nmembres fondateurs et de 5 membres maximum élus pour\n3 ans par l'AG. Les membres sont rééligibles.\nLe CA se réunit au moins une fois par trimestre.\nDécisions à la majorité. Voix prépondérante du président.\nMinimum 3 membres pour délibérer valablement.\nVote par procuration non autorisé.\n\nArticle XIII – Perte de la qualité de membre du CA\nPar : la démission ; le décès ; la radiation prononcée\npar le CA pour non-paiement ou motif grave.\n\nArticle XIV – Le Bureau\nLe CA désigne parmi ses membres, au scrutin secret :\n- Un(e) président(e)\n- Un(e) trésorier(ère)\n- Un(e) secrétaire\nÉlu pour 3 ans. Membres sortants rééligibles.\n\nArticle XV – Rôle des membres du bureau\nLe président représente l'association dans tous les actes\nde la vie civile. Il peut donner délégation à un autre membre.\nLe secrétaire gère la correspondance, rédige les PV et\ntient le registre spécial prévu par la loi du 1er juillet 1901.\nLe trésorier tient les comptes, effectue les paiements et\nrend compte en AGO.\n\nArticle XVI – Comptabilité\nComptabilité tenue en recettes et dépenses au jour le jour\npour l'enregistrement de toutes les opérations financières.\n\nArticle XVII – Indemnités et rémunérations\nRemboursement de frais sur justificatifs. La rémunération\nmensuelle par dirigeant ne peut excéder les ¾ du SMIC\nbrut mensuel.\n\nArticle XVIII – Règlement intérieur\nÉtabli par le CA et approuvé par l'AG. Fixe les points\nnon prévus par les statuts, notamment l'administration\ninterne de l'association.\n\nArticle XIX – Formalités administratives\nLe président accomplit toutes les formalités de déclaration\net publication prévues par la loi du 1er juillet 1901,\ntant au moment de la création qu'au cours de son existence.\n\n${"─".repeat(60)}\nLes présents statuts ont été approuvés par l'Assemblée\nGénérale Ordinaire du ${g("date_ag_constitutive")}.\n\nFait à ${g("lieu_ag")}, le ${today}\n\nLa/Le Président(e)               La/Le Trésorier(ère)\n${g("president_prenom")} ${g("president_nom")}          ${g("tresorier_prenom")} ${g("tresorier_nom")}`,

    "pv-agc":`Association ${g("nom_asso").toUpperCase()}\n${g("adresse_siege")}\n${g("telephone")} - ${g("email")}\n${"─".repeat(60)}\n\nPROCES VERBAL DE L'ASSEMBLEE CONSTITUTIVE\ndu ${g("date_ag")}\n${"─".repeat(60)}\n\nEn date du ${g("date_ag")} à ${g("heure_ag")}h, les membres fondateurs\nde l'association « ${g("nom_asso")} » se sont réunis en assemblée\nconstitutive chez ${g("nom_hote")}, à l'adresse ci-dessus.\n\nSont présents :\n${g("membres_presents")}\n\nL'assemblée générale désigne ${g("president_seance_titre")} ${g("president_seance_nom")}\nen qualité de président de séance et\n${g("secretaire_seance_titre")} ${g("secretaire_seance_nom")} en qualité de secrétaire de séance.\n\nLe président donne lecture des statuts de l'association.\nIls sont adoptés en l'état.\n\nL'assemblée générale constitutive désigne :\n\nEn qualité de président(e) :\n${g("president_titre")} ${g("president_prenom")} ${g("president_nom")}\nTéléphone : ${g("president_tel")}\nNationalité : ${g("president_nationalite")}\nProfession : ${g("president_profession")}\nDomicilié(e) : ${g("president_adresse")}\n\nEn qualité de trésorier(ère) :\n${g("tresorier_titre")} ${g("tresorier_prenom")} ${g("tresorier_nom")}\nTéléphone : ${g("tresorier_tel")}\nNationalité : ${g("tresorier_nationalite")}\nProfession : ${g("tresorier_profession")}\nDomicilié(e) : ${g("tresorier_adresse")}\n${g("secretaire_assure_par") ? "Elle/Il assure également le secrétariat." : ""}\n\nConformément aux statuts, cette désignation est faite pour\nune durée de trois (3) années, expirant lors de l'Assemblée\nGénérale qui sera appelée à statuer sur les comptes de\nl'exercice clos le 31 décembre ${g("annee_fin_mandat")}.\n\nIl est voté à l'unanimité qu'une cotisation de ${g("cotisation_annuelle")} €\nannuelle devra être versée à l'Association par tous ses\nmembres actifs ou passifs.\nLes détails seront consignés dans le règlement intérieur.\n\nLes membres du conseil ainsi désignés acceptent les fonctions\nqui leur ont été confiées et se chargeront d'effectuer les\nformalités prévues à sa légalisation en préfecture.\n\n${"─".repeat(60)}\nFait à ${g("lieu_signature")}, le ${g("date_ag")}\n\nLa/Le Président(e)               La/Le Trésorier(ère)\n${g("president_titre")} ${g("president_nom")}           ${g("tresorier_titre")} ${g("tresorier_nom")}`,

    "pv-ago":`Association ${g("nom_asso").toUpperCase()}\n${g("adresse_siege")}\n${g("telephone")} - ${g("email")}\n${"─".repeat(60)}\n\nPROCES VERBAL DE L'ASSEMBLEE GENERALE ORDINAIRE\ndu ${g("date_ag")}\n${"─".repeat(60)}\n\nEn date du ${g("date_ag")} à ${g("heure_ag")}h, les membres de\nl'association « ${g("nom_asso")} » se sont réunis en Assemblée\nGénérale Ordinaire ${g("lieu_ag")}, chez ${g("nom_hote")}.\n\nSont présents :\n${g("membres_presents")}\n${g("membres_excuses") ? "\nSont excusés :\n"+g("membres_excuses") : ""}\n\n${g("president_seance")} préside la réunion et assure le secrétariat.\n\n${"─".repeat(40)}\nBILAN ADMINISTRATIF ET DES PROJETS\n${"─".repeat(40)}\n${g("bilan_activites")}\n\n${"─".repeat(40)}\nBILAN FINANCIER\n${"─".repeat(40)}\nRecettes     : ${g("recettes")} €\nDépenses     : ${g("depenses")} €\nBénévolat    : ${g("benevolat")||"0"} €\nRésultat net : ${g("resultat")} €\n\n${g("bilan_financier")}\n\n${"─".repeat(40)}\nELECTION DU CONSEIL D'ADMINISTRATION ET BUREAU\n${"─".repeat(40)}\nL'Assemblée procède au vote pour élire les membres\ndu conseil d'administration.\nLes membres du bureau sont désignés à l'unanimité :\n\nEn qualité de président(e) :\n${g("nouveau_president_titre")} ${g("nouveau_president_nom")}\nTéléphone : ${g("nouveau_president_tel")}\nMail : ${g("nouveau_president_mail")}\nNationalité : ${g("nouveau_president_nationalite")}\nProfession : ${g("nouveau_president_profession")}\nDomicilié(e) : ${g("nouveau_president_adresse")}\n\nEn qualité de secrétaire :\n${g("nouveau_secretaire_titre")} ${g("nouveau_secretaire_nom")}\nTéléphone : ${g("nouveau_secretaire_tel")}\nMail : ${g("nouveau_secretaire_mail")}\nNationalité : ${g("nouveau_secretaire_nationalite")}\nProfession : ${g("nouveau_secretaire_profession")}\nDomicilié(e) : ${g("nouveau_secretaire_adresse")}\n\nConformément aux statuts, cette désignation est faite\npour une durée de trois années, expirant lors de l'AG\nqui statuera sur les comptes de l'exercice clos le\n31 décembre ${g("annee_fin_mandat")}.\n\n${"─".repeat(40)}\nMODIFICATIONS DES STATUTS\n${"─".repeat(40)}\n${g("modifications_statuts")||"Aucune modification statutaire à cette AG."}\n\n${"─".repeat(40)}\nDIVERS\n${"─".repeat(40)}\nIl est voté que :\n- Montant de l'adhésion annuelle : ${g("montant_adhesion")} €\n- Montant de la cotisation membre actif : ${g("montant_cotisation")} €\nLes détails seront consignés dans le règlement intérieur.\n\nLes membres du conseil acceptent les fonctions confiées\net se chargent d'effectuer les formalités en préfecture.\n\n${"─".repeat(60)}\nFait à ${g("lieu_signature")}, le ${g("date_ag")}\n\nLa/Le Président(e)               Le/La Secrétaire\n${g("president_nom")}                    ${g("secretaire_nom")}`,

    "pv-age":`${g("nom_asso").toUpperCase()}\n${g("adresse_siege")}\n${"─".repeat(60)}\n\nPROCES VERBAL DE L'ASSEMBLEE GENERALE EXTRAORDINAIRE\ndu ${g("date_ag")}\n${"─".repeat(60)}\n\nEn date du ${g("date_ag")} à ${g("heure_ag")},\nles membres de l'association « ${g("nom_asso")} » se sont réunis\nen Assemblée Générale Extraordinaire ${g("lieu_ag")}.\n\nSont présents : ${g("membres_presents")}\n\n${g("president_seance")} préside la réunion.\n${g("secretaire_seance")} assure le secrétariat.\n\nObjet de la convocation :\n${g("objet_age")}\n\n${"─".repeat(40)}\nDÉLIBÉRATIONS\n${"─".repeat(40)}\n${g("modifications")}\n\n${"─".repeat(40)}\nVOTE\n${"─".repeat(40)}\nVotes pour    : ${g("votes_pour")}\nVotes contre  : ${g("votes_contre")}\nAbstentions   : ${g("abstentions")}\n\nDÉCISIONS ADOPTÉES\n${g("decisions")}\n\n${"─".repeat(60)}\nFait à ${g("lieu_signature")}, le ${g("date_ag")}\n\nLa/Le Président(e)               Le/La Secrétaire\n${g("president_nom")}                    ${g("secretaire_nom")}`,

    "liste-membres-bureau":`Association ${g("nom_asso").toUpperCase()}\n${g("adresse_siege")}\n${g("telephone")} - ${g("email")}\n${"─".repeat(60)}\n\nANNEXE AU PROCES VERBAL\ndu ${g("date_signature")}\n\nLISTE DES PERSONNES MEMBRES DU BUREAU\net chargées de l'administration et la direction\nde l'association ${g("nom_asso")} pour ${g("periode_mandat")} :\n${"─".repeat(60)}\n\n1  ${g("membre1_titre")} ${g("membre1_nom")} ${g("membre1_prenom")}\n   Né(e) le : ${g("membre1_naissance")} à ${g("membre1_lieu_naissance")}\n   Nationalité : ${g("membre1_nationalite")}\n   Profession : ${g("membre1_profession")}\n   Adresse : ${g("membre1_adresse")}, ${g("membre1_cp_ville")}\n   Tél : ${g("membre1_telephone")} — Mail : ${g("membre1_email")}\n   EN QUALITÉ DE : ${g("membre1_qualite").toUpperCase()}\n\n2  ${g("membre2_titre")} ${g("membre2_nom")} ${g("membre2_prenom")}\n   Né(e) le : ${g("membre2_naissance")} à ${g("membre2_lieu_naissance")}\n   Nationalité : ${g("membre2_nationalite")}\n   Profession : ${g("membre2_profession")}\n   Adresse : ${g("membre2_adresse")}, ${g("membre2_cp_ville")}\n   Tél : ${g("membre2_telephone")} — Mail : ${g("membre2_email")}\n   EN QUALITÉ DE : ${g("membre2_qualite").toUpperCase()}\n\n${"─".repeat(60)}\nFait à ${g("lieu_signature")}, le ${g("date_signature")}\n\nLa/Le Président(e)               Le/La Secrétaire\n${g("president_nom")}                    ${g("secretaire_nom")}`,

    "convention-subvention":`CONVENTION DE SUBVENTION\n${"─".repeat(60)}\n\nENTRE :\nL'organisme financeur : ${g("organisme_financeur")}\nReprésenté par : ${g("representant")}\n\nET :\nL'association : ${g("nom_asso")}\nReprésentée par sa présidente/président : ${g("president_asso")}\nAdresse : ${g("adresse_asso")}\n\nArticle 1 – Objet de la subvention\n${g("objet_subvention")}\n\nArticle 2 – Montant\nLa subvention accordée s'élève à ${g("montant")} €.\n\nArticle 3 – Conditions d'utilisation\n${g("conditions_utilisation")}\n\nArticle 4 – Durée\n${g("duree")}\n\nArticle 5 – Modalités de versement\n${g("modalites_versement")}\n\nArticle 6 – Obligations de l'association\nL'association s'engage à :\n- Utiliser la subvention conformément à l'objet défini\n- Fournir un bilan d'utilisation à la demande du financeur\n- Restituer les fonds non utilisés conformément à l'objet\n\n${"─".repeat(60)}\nFait le ${g("date")||today}\n\nPour l'organisme financeur :      Pour l'association :\n${g("representant")}               ${g("president_asso")}`,
    "bulletin-adhesion":`BULLETIN D'ADHÉSION ${g("annee")}\n${"─".repeat(60)}\nAssociation : ${g("nom_asso")}\n${"─".repeat(60)}\n\nJe soussigné(e) :\nNom : ${g("nom_adherent")}         Prénom : ${g("prenom_adherent")}\nDate de naissance : ${g("date_naissance_a")}\nAdresse : ${g("adresse_adherent")}\nEmail : ${g("email")}\nTéléphone : ${g("telephone_adherent")}\n\nSouhaite adhérer en qualité de : ${g("type_membre")}\n\nMontant de l'adhésion : ${g("montant_adhesion")} €\nCotisation membre actif : ${g("montant_cotisation_actif")} €\n\nJe déclare avoir pris connaissance des statuts\net du règlement intérieur de l'association.\n\n${"─".repeat(60)}\nFait le ${today}\n\nSignature de l'adhérent(e) :`,

    "ri-asso":`RÈGLEMENT INTÉRIEUR\n${"─".repeat(60)}\nAssociation : ${g("nom_asso")}\nAdopté le : ${g("date_adoption")}\n${"─".repeat(60)}\n\nArticle 1 – Objet\nLe présent règlement intérieur précise les statuts\nde l'association ${g("nom_asso")}.\n\nArticle 2 – Modalités d'adhésion\n${g("modalites_adhesion")}\n\nArticle 3 – Cotisations\n- Montant de l'adhésion : ${g("montant_adhesion")} €/an\n- Cotisation membre actif : ${g("montant_cotisation")} €/an\n\nArticle 4 – Droit de vote\n${g("droit_vote")}\n\nArticle 5 – Discipline\n${g("discipline")}\n\nArticle 6 – Modification\nLe règlement peut être modifié par le CA\net approuvé par l'AG.\n\n${"─".repeat(60)}\nFait à ${g("lieu_signature")}, le ${today}\n\nLa/Le Président(e)               Le/La Secrétaire\n${g("president")}                    ${g("secretaire")}`,

    "contrat-moniteur-avec-vehicule":`CONTRAT DE PRESTATION DE SERVICES\nMoniteur Indépendant avec véhicule — Auto-entrepreneur\n${"─".repeat(60)}\n\nEntre les soussignés\n\n${g("nom_ecole")}, auto-école,\ndont le siège social est situé à : ${g("adresse_ecole")},\nimmatriculée sous le numéro ${g("siret_ecole")},\nAgrément préfectoral : ${g("agrement_ecole")},\nAutorisation d'enseigner : ${g("autorisation_enseigner_ecole")},\nreprésentée par ${g("dirigeant")},\nci-après dénommée « l'Auto-école »,\n\nET\n\n${g("civilite_moniteur")} ${g("nom_moniteur")}, moniteur d'auto-école indépendant,\ndomicilié(e) à ${g("adresse_moniteur")},\nimmatriculé(e) en tant qu'indépendant sous le numéro ${g("siren_moniteur")},\ntitulaire de l'autorisation d'enseigner n° ${g("autorisation_moniteur")},\nci-après dénommé(e) « le Prestataire ».\n\nEnsemble dénommés « les Parties ».\n${"─".repeat(60)}\nPréambule\n${"─".repeat(60)}\nL'Auto-école exerce une activité réglementée d'enseignement\nde la conduite et de la sécurité routière, conformément\naux dispositions du Code de la route.\nLe Prestataire exerce son activité à titre strictement\nindépendant, avec ses propres moyens matériels et organisationnels.\nLes Parties entendent formaliser leurs relations dans le cadre\nd'un contrat de prestation de services, excluant toute\nsituation de subordination juridique.\nIl est expressément convenu que le présent contrat ne\nconstitue ni un contrat de travail, ni une collaboration\nsalariée, et qu'il ne pourra faire l'objet d'aucune requalification.\n\n${"─".repeat(60)}\nArticle 1 – Objet du contrat\n${"─".repeat(60)}\nLe présent contrat définit les conditions dans lesquelles\nle Prestataire assure, en toute indépendance, des prestations\nd'enseignement de la conduite automobile et de la sécurité\nroutière pour les élèves de l'Auto-école.\n\n${"─".repeat(60)}\nArticle 2 – Indépendance – Absence de lien de subordination\n${"─".repeat(60)}\nLes Parties reconnaissent expressément que le Prestataire\nexerce son activité en totale indépendance. À ce titre :\n• Le Prestataire organise librement son activité,\n  ses méthodes pédagogiques et son emploi du temps ;\n• Aucun horaire, planning minimum ou volume d'heures\n  n'est imposé par l'Auto-école ;\n• Le Prestataire demeure libre d'accepter ou de refuser\n  toute mission ;\n• Le Prestataire peut exercer son activité pour toute\n  autre auto-école ou client ;\n• Aucune sanction disciplinaire ne peut être prononcée\n  par l'Auto-école à l'encontre du Prestataire, toutefois\n  le Prestataire doit respecter le règlement intérieur ;\n• Le Prestataire supporte seul l'ensemble de ses charges\n  sociales, fiscales et professionnelles.\n\n${"─".repeat(60)}\nArticle 3 – Obligations réglementaires du Prestataire\n${"─".repeat(60)}\nLe Prestataire s'engage, pendant toute la durée du contrat, à :\n• Être titulaire d'une autorisation préfectorale d'enseigner\n  valide ;\n• Satisfaire aux conditions d'aptitude médicale requises ;\n• Respecter le Code de la route et la réglementation ;\n• Dispenser un enseignement conforme aux programmes officiels ;\n• Tenir à jour les documents pédagogiques obligatoires ;\n• Informer immédiatement l'Auto-école de toute suspension\n  ou retrait de son autorisation.\n\n${"─".repeat(60)}\nArticle 4 – Véhicule, matériel et frais\n${"─".repeat(60)}\nLe Prestataire utilise son propre véhicule d'enseignement,\néquipé de doubles commandes conformes à la réglementation.\nLe Prestataire supporte seul :\n• L'entretien et les frais de carburant du véhicule ;\n• Les assurances du véhicule ;\n• L'ensemble des frais liés à son activité.\nLa rémunération inclut expressément ces frais,\nsans possibilité de refacturation complémentaire.\n\n${"─".repeat(60)}\nArticle 5 – Obligations de l'Auto-école\n${"─".repeat(60)}\nL'Auto-école s'engage à :\n• Transmettre les informations nécessaires sur les élèves ;\n• Assurer la coordination administrative des élèves ;\n• Respecter strictement l'indépendance du Prestataire ;\n• Régler les prestations dans les conditions prévues\n  à l'article 9.\n\n${"─".repeat(60)}\nArticle 6 – Élèves recommandés par le Prestataire\n${"─".repeat(60)}\nLes élèves recommandés par le Prestataire peuvent s'inscrire\nlibrement auprès de l'Auto-école pour la préparation du code,\ndu permis et tout service complémentaire.\nCette mise en relation n'ouvre droit à aucune rémunération,\ncommission ou avantage financier au bénéfice du Prestataire.\n\n${"─".repeat(60)}\nArticle 7 – Élèves inscrits à l'Auto-école\n${"─".repeat(60)}\nLe Prestataire intervient exclusivement en qualité de\nprestataire pédagogique indépendant. La relation contractuelle\navec les élèves demeure exclusive entre l'Auto-école et eux.\n\n${"─".repeat(60)}\nArticle 8 – Propriété des plannings et données (RGPD)\n${"─".repeat(60)}\nLes plannings et données personnelles des élèves demeurent\nla propriété exclusive de l'Auto-école.\nLe Prestataire agit en qualité de sous-traitant au sens\ndu RGPD. Il s'engage à :\n• N'utiliser les données que pour l'exécution des prestations ;\n• Garantir leur confidentialité et sécurité ;\n• Ne procéder à aucune conservation ou réutilisation ;\n• Restituer ou supprimer les données à l'issue du contrat.\n\n${"─".repeat(60)}\nArticle 9 – Rémunération\n${"─".repeat(60)}\nEn contrepartie des prestations, le Prestataire percevra\nune rémunération de ${g("tarif_heure")} € TTC par heure de cours\neffectivement réalisée.\nLe paiement interviendra :\n• Sur présentation d'une facture mensuelle ;\n• En fin de mois civil ;\n• Par virement bancaire dans un délai de 10 jours.\n\n${"─".repeat(60)}\nArticle 10 – Responsabilité et assurances\n${"─".repeat(60)}\nLe Prestataire est seul responsable des dommages causés\ndans le cadre de son activité et s'engage à maintenir\nune assurance RC professionnelle couvrant ses prestations.\n\n${"─".repeat(60)}\nArticle 11 – Confidentialité\n${"─".repeat(60)}\nLe Prestataire s'engage à la stricte confidentialité de\ntoutes informations relatives à l'Auto-école et à ses élèves.\n\n${"─".repeat(60)}\nArticle 12 – Durée du contrat\n${"─".repeat(60)}\nLe présent contrat est conclu pour une durée déterminée,\ndu ${g("date_debut")} au ${g("date_fin")}.\n\n${"─".repeat(60)}\nArticle 13 – Non-sollicitation\n${"─".repeat(60)}\nLe Prestataire s'interdit, pendant la durée du contrat\naugmentée d'un (1) an après sa résiliation, d'inciter tout\ncollaborateur de l'Auto-école à quitter cette dernière.\n\n${"─".repeat(60)}\nArticle 14 – Résiliation\n${"─".repeat(60)}\nEn cas de non-respect des obligations, le contrat pourra\nêtre résilié moyennant un préavis de 5 semaines.\nEn cas de perte de l'autorisation d'enseigner :\nrésiliation immédiate.\n\n${"─".repeat(60)}\nArticle 15 – Non-exclusivité\n${"─".repeat(60)}\nLe présent contrat est conclu sans exclusivité.\n\n${"─".repeat(60)}\nArticle 16 – Droit applicable et litiges\n${"─".repeat(60)}\nContrat soumis au droit français. Tout litige relèvera\nde la compétence des tribunaux du ressort du siège social\nde l'Auto-école.\n\n${"─".repeat(60)}\nFait à ${g("lieu_signature")}, le ${g("date_signature")}, en deux exemplaires.\n\nPour l'Auto-école :               Le Prestataire :\n${g("dirigeant")}, Gérant             ${g("nom_moniteur")}\nSignature :                       Signature :\n\n${"─".repeat(60)}\nANNEXE – Documents obligatoires à fournir par le Prestataire\n${"─".repeat(60)}\n• Autorisation préfectorale d'enseigner en cours de validité\n• Attestation d'assurance RC professionnelle\n• Attestation d'assurance du véhicule d'enseignement\n• Justificatif d'immatriculation en tant qu'indépendant\n• Attestation de vigilance URSSAF\n• Contrat de prestation avec toute autre structure ou\n  plateforme d'auto-école`,

seignement.\nLe Prestataire demeure responsable de toute infraction\ncommise durant l'utilisation du véhicule.\nEn cas de dégradation par faute ou négligence du Prestataire,\nsa responsabilité civile pourra être engagée.\n\n${"─".repeat(60)}\nArticle 6 – Élèves et relation contractuelle\n${"─".repeat(60)}\n6-1 Le Prestataire intervient exclusivement auprès des élèves\ninscrits à l'Auto-école. La relation contractuelle avec\nles élèves demeure exclusivement entre l'Auto-école et eux.\nLe Prestataire ne peut démarcher les élèves à titre personnel.\n\n6-2 L'Auto-école s'engage à :\n• Transmettre les informations nécessaires sur les élèves ;\n• Assurer la coordination administrative ;\n• Respecter strictement l'indépendance du Prestataire ;\n• Régler les prestations dans les conditions prévues\n  à l'article 8.\n\n${"─".repeat(60)}\nArticle 7 – Propriété des plannings et données (RGPD)\n${"─".repeat(60)}\nLes plannings, dossiers élèves et données personnelles\nsont la propriété exclusive de l'Auto-école.\nLe Prestataire agit en qualité de sous-traitant au sens\ndu RGPD et s'engage à :\n• N'utiliser les données que pour l'exécution des prestations ;\n• Garantir leur confidentialité ;\n• Ne procéder à aucune conservation ou réutilisation ;\n• Restituer ou supprimer les données à l'issue du contrat.\n\n${"─".repeat(60)}\nArticle 8 – Rémunération\n${"─".repeat(60)}\nEn contrepartie des prestations, le Prestataire percevra\nune rémunération de ${g("tarif_heure")} € TTC par heure de cours\neffectivement réalisée.\nCette rémunération inclut la mise à disposition du véhicule,\ndu carburant et du matériel par l'Auto-école.\nLe paiement interviendra :\n• Sur présentation d'une facture mensuelle ;\n• En fin de mois civil ;\n• Par virement bancaire dans un délai de 10 jours.\n\n${"─".repeat(60)}\nArticle 9 – Responsabilité et assurances\n${"─".repeat(60)}\nLe Prestataire est seul responsable des dommages causés\ndans le cadre de son activité et s'engage à maintenir\nune assurance RC professionnelle couvrant ses prestations.\n\n${"─".repeat(60)}\nArticle 10 – Confidentialité\n${"─".repeat(60)}\nLe Prestataire s'engage à la stricte confidentialité de\ntoutes informations relatives à l'Auto-école et à ses élèves.\n\n${"─".repeat(60)}\nArticle 11 – Durée du contrat\n${"─".repeat(60)}\nLe présent contrat est conclu pour une durée indéterminée,\nà compter du ${g("date_debut")}.\n\n${"─".repeat(60)}\nArticle 12 – Résiliation\n${"─".repeat(60)}\nLe contrat pourra être résilié moyennant un préavis\nde 5 semaines. En cas de manquement grave ou de perte\nde l'autorisation d'enseigner : résiliation immédiate.\n\n${"─".repeat(60)}\nArticle 13 – Non-exclusivité\n${"─".repeat(60)}\nLe présent contrat est conclu sans exclusivité.\n\n${"─".repeat(60)}\nArticle 14 – Droit applicable et litiges\n${"─".repeat(60)}\nContrat soumis au droit français. Tout litige relèvera\nde la compétence des tribunaux du ressort du siège social\nde l'Auto-école.\n\n${"─".repeat(60)}\nFait à ${g("lieu_signature")}, le ${g("date_signature")}, en deux exemplaires.\n\nPour l'Auto-école :               Le Prestataire :\n${g("dirigeant")}, Gérant             ${g("nom_moniteur")}\nSignature :                       Signature :\n\n${"─".repeat(60)}\nANNEXE 1 – Documents obligatoires à fournir par le Prestataire\n${"─".repeat(60)}\n• Autorisation préfectorale d'enseigner en cours de validité\n• Attestation d'assurance RC professionnelle\n• Justificatif d'immatriculation en tant qu'indépendant\n• Attestation de vigilance URSSAF`,

              <div style={{fontSize:11,color:T.muted,marginTop:3}}>Paiement unique · Sans engagement</div>
              <div style={{marginTop:12,background:T.accent,color:"#fff",borderRadius:8,padding:"8px 0",fontSize:13,fontWeight:700}}>💳 Payer 1€</div>
            </a>

            {/* Option 9€/mois */}
            <a href="https://buy.stripe.com/fZu14mcB2cW4fhYblvbV601" target="_blank" rel="noopener noreferrer"
              style={{background:`${T.purple}15`,border:`2px solid ${T.purple}`,borderRadius:14,padding:"20px 16px",textDecoration:"none",display:"block",transition:"all 0.15s",position:"relative"}}
              onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.background=`${T.purple}25`;}}
              onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.background=`${T.purple}15`;}}>
              <div style={{position:"absolute",top:-11,left:"50%",transform:"translateX(-50%)",background:T.purple,color:"#fff",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20,whiteSpace:"nowrap"}}>⭐ Meilleure offre</div>
              <div style={{fontSize:28,fontWeight:900,fontFamily:"'Syne',sans-serif",color:T.purple,letterSpacing:"-1px"}}>9€</div>
              <div style={{fontSize:13,fontWeight:700,color:T.text,marginTop:4}}>Abonnement mensuel</div>
              <div style={{fontSize:11,color:T.muted,marginTop:3}}>Documents illimités · IA incluse</div>
              <div style={{marginTop:12,background:T.purple,color:"#fff",borderRadius:8,padding:"8px 0",fontSize:13,fontWeight:700}}>🚀 S'abonner</div>
            </a>
          </div>

          <div style={{fontSize:12,color:T.dim,marginBottom:6}}>🔒 Paiement 100% sécurisé via Stripe</div>
          <div style={{fontSize:11,color:T.dim}}>Après paiement, revenez sur cette page — votre document sera disponible.</div>

          {/* Bouton retour après paiement */}
          <div style={{marginTop:20,padding:"14px 20px",background:T.bg2,border:`1px solid ${T.border}`,borderRadius:12}}>
            <div style={{fontSize:13,color:T.muted,marginBottom:10}}>Vous venez de payer ? Cliquez ici pour accéder à votre document :</div>
            <button style={{...S.btn(T.green),justifyContent:"center",width:"100%",padding:"12px"}} onClick={pay}>
              ✅ J'ai payé — Accéder à mon document
            </button>
          </div>
        </div>

        <div style={{position:"relative"}}>
          <div style={{...S.pre,filter:"blur(5px)",userSelect:"none",pointerEvents:"none"}}>{preview}</div>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(7,11,20,0.55)",borderRadius:14}}><div style={{fontSize:44}}>🔒</div></div>
        </div>
      </div>
    </div>
  );

  // PREVIEW
  if(screen==="preview") return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        <button style={S.back} onClick={reset}>← Nouveau document</button>
        <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:20,background:`${T.green}10`,border:`1px solid ${T.green}25`,borderRadius:11,padding:"11px 16px"}}>
          <span>✅</span>
          <div>
            <div style={{fontWeight:700,color:T.green,fontSize:14}}>Document généré avec succès</div>
            <div style={{fontSize:12,color:T.muted}}>Il reste <strong style={{color:T.accent}}>{credits} crédit{credits!==1?"s":""}</strong> sur votre compte</div>
          </div>
        </div>
        <div style={{fontSize:17,fontWeight:700,fontFamily:"'Syne',sans-serif",marginBottom:3}}>{doc?.label}</div>
        <div style={{fontSize:13,color:T.muted,marginBottom:14}}>{pole?.label}</div>
        <div style={S.pre}>{preview}</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
          <button style={S.btn(T.accent)} onClick={()=>download("docx")}>📄 Word (.docx)</button>
          <button style={S.btn(T.blue)} onClick={()=>download("pdf")}>📕 PDF</button>
          <button style={S.btnSec} onClick={copy}>{copied?"✅ Copié !":"📋 Copier le texte"}</button>
          <button style={S.btnSec} onClick={reset}>Nouveau document</button>
        </div>

      </div>
    </div>
  );

  // IA
  if(screen==="ai") return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        <button style={S.back} onClick={()=>go("home")}>← Retour</button>
        <div style={{display:"flex",alignItems:"center",gap:13,marginBottom:26}}>
          <div style={{width:48,height:48,background:`linear-gradient(135deg,${T.purple},${T.blue})`,borderRadius:13,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>✨</div>
          <div>
            <h2 style={{fontSize:21,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>Génération IA</h2>
            <div style={{fontSize:13,color:T.muted}}>Décrivez votre document — l'IA le génère pour vous.</div>
          </div>
        </div>
        <div style={S.card}>
          <label style={S.label}>Décrivez le document souhaité</label>
          <textarea style={{...S.textarea,marginBottom:14,borderColor:aiPrompt?T.purple:T.border}}
            value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)}
            placeholder={"Exemples :\n• \"Un contrat de location de véhicule, 3 jours à 45€/jour\"\n• \"Une lettre de démission avec préavis de 2 mois\"\n• \"Un règlement intérieur pour une salle de sport associative\""}
            onFocus={e=>e.target.style.borderColor=T.purple} onBlur={e=>e.target.style.borderColor=aiPrompt?T.purple:T.border}/>
          <div style={{display:"flex",gap:11,alignItems:"center",flexWrap:"wrap"}}>
            <button style={{...S.btn(T.purple),opacity:aiLoading||!aiPrompt.trim()?0.5:1,cursor:aiLoading||!aiPrompt.trim()?"not-allowed":"pointer"}}
              onClick={generateWithAI} disabled={aiLoading||!aiPrompt.trim()}>
              {aiLoading?<><span className="spin">⟳</span> Génération en cours...</>:"✨ Générer avec l'IA"}
            </button>
            {user&&<span style={{fontSize:12,color:T.muted}}>{credits} crédit{credits!==1?"s":""} disponible{credits!==1?"s":""}</span>}
          </div>
          {aiError&&<div style={{marginTop:12,padding:"9px 13px",background:"#FF444418",border:"1px solid #FF444435",borderRadius:9,fontSize:13,color:"#FF7070"}}>{aiError}</div>}
        </div>

        {!aiResult&&!aiLoading&&(
          <div>
            <div style={S.sec}>Idées de documents</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:9}}>
              {["Un contrat de location de salle pour événement","Une lettre de recommandation professionnelle","Un accord de prêt entre particuliers pour 2000€","Un contrat de bénévolat pour une association","Un contrat de cession de véhicule entre particuliers","Une promesse d'embauche pour un poste de commercial"].map(ex=>(
                <div key={ex} style={{...S.card,padding:"12px 15px",cursor:"pointer",fontSize:13,color:T.muted,transition:"all 0.15s"}}
                  onClick={()=>setAiPrompt(ex)}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=T.purple;e.currentTarget.style.color=T.text;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;}}>
                  💬 {ex}
                </div>
              ))}
            </div>
          </div>
        )}

        {aiResult&&(
          <div>
            <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14,padding:"9px 14px",background:`${T.green}10`,border:`1px solid ${T.green}25`,borderRadius:9}}>
              <span>✅</span><span style={{fontSize:14,color:T.green,fontWeight:600}}>Document généré par l'IA</span>
            </div>
            <div style={S.pre}>{aiResult}</div>
            <div style={{display:"flex",gap:11,flexWrap:"wrap",marginBottom:14}}>
              <button style={S.btn(T.accent)} onClick={()=>downloadAI("docx")}>📄 Word (.docx)</button>
              <button style={S.btn(T.blue)} onClick={()=>downloadAI("pdf")}>📕 PDF</button>
              <button style={S.btn(T.blue)} onClick={copyAI}>{aiCopied?"✅ Copié !":"📋 Copier"}</button>
              <button style={S.btnSec} onClick={()=>{setAiResult("");setAiPrompt("");}}>Nouveau</button>
            </div>
<button style={S.btnSec} onClick={()=>{setAiResult("");setAiPrompt("");}}>Nouveau</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
