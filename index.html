<html lang="fr">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#070B14;font-family:'DM Sans',sans-serif;color:#EEF2FF;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0D1221}::-webkit-scrollbar-thumb{background:#1E2D4A;border-radius:3px}
input,textarea{font-family:'DM Sans',sans-serif}
input::placeholder,textarea::placeholder{color:#3A4A65}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  bg:"#070B14",bg2:"#0D1221",card:"#111827",card2:"#162033",
  border:"#1A2840",border2:"#243350",

  grad:"linear-gradient(135deg,#F97316,#FB923C)"

const POLES = [
  {id:"auto-ecole",icon:"🚗",label:"Auto-École & Moniteurs",color:T.blue,
   desc:"Documents pour moniteurs indépendants et gérants d'auto-école",
   docs:[
    {id:"contrat-eleve",label:"Contrat de formation élève (B)",fields:["nom_ecole","adresse_ecole","siret_ecole","moniteur","nom_eleve","prenom_eleve","date_naissance","adresse_eleve","telephone_eleve","formule","nb_heures","montant","modalite_paiement"]},
    {id:"attestation-heures",label:"Attestation d'heures de conduite",fields:["nom_ecole","moniteur","nom_eleve","prenom_eleve","nb_heures","date_debut","date_fin","type_formation"]},
    {id:"recu-paiement",label:"Reçu de paiement élève",fields:["nom_ecole","moniteur","nom_eleve","prenom_eleve","montant","mode_paiement","objet","date","numero_recu"]},
    {id:"reglement-interieur",label:"Règlement intérieur auto-école",fields:["nom_ecole","adresse_ecole","telephone","email_ecole","moniteur","date_application"]},
    {id:"fiche-suivi-eleve",label:"Fiche de suivi pédagogique",fields:["nom_ecole","moniteur","nom_eleve","prenom_eleve","date_inscription","nb_heures_effectuees","points_forts","points_ameliorer","estimation_examen"]},
    {id:"contrat-moniteur",label:"Contrat moniteur indépendant",fields:["nom_ecole","adresse_ecole","siret_ecole","dirigeant","nom_moniteur","adresse_moniteur","siret_moniteur","date_debut","tarif_heure","modalites"]},
    {id:"attestation-fin",label:"Attestation de fin de formation",fields:["nom_ecole","moniteur","nom_eleve","prenom_eleve","date_debut","date_fin","nb_heures_total","formule"]},
  ]},
  {id:"entrepreneur",icon:"📄",label:"Entrepreneurs & Artisans",color:T.accent,
   desc:"Documents administratifs et contractuels pour tous secteurs",
   docs:[
    {id:"contrat-prestation",label:"Contrat de prestation de services",fields:["prestataire","siret_presta","adresse_prestataire","client","siret_client","adresse_client","objet_mission","montant_ht","tva","date_debut","duree","modalites_paiement","penalites"]},
    {id:"convention-partenariat",label:"Convention de partenariat",fields:["structure1","siret1","referent1","adresse1","structure2","siret2","referent2","adresse2","objet_partenariat","apports_s1","apports_s2","duree","date"]},
    {id:"devis",label:"Devis commercial",fields:["prestataire","siret_presta","adresse_prestataire","client","adresse_client","prestations","montant_ht","tva","remise","validite","date"]},
    {id:"facture",label:"Facture",fields:["prestataire","siret_presta","adresse_prestataire","client","adresse_client","numero_facture","date","prestations","montant_ht","tva","echeance"]},
    {id:"mise-en-demeure",label:"Lettre de mise en demeure",fields:["expediteur","adresse_exp","destinataire","adresse_dest","objet_litige","montant","reference","delai","date"]},
    {id:"pv-ag",label:"Procès-verbal d'AG",fields:["nom_asso","adresse_asso","date_ag","lieu","president_seance","secretaire","nb_membres_presents","ordre_du_jour","decisions"]},
    {id:"nda",label:"Accord de confidentialité (NDA)",fields:["partie1","adresse_p1","partie2","adresse_p2","objet_confidentiel","duree_nda","juridiction","date"]},
    {id:"lettre-resil",label:"Lettre de résiliation",fields:["expediteur","adresse_exp","destinataire","adresse_dest","reference_contrat","date_contrat","motif","date_effet","date"]},
    {id:"cession-droit",label:"Cession de droits d'auteur",fields:["cedant","adresse_cedant","cessionnaire","adresse_cessionnaire","objet_creation","territoire","duree_cession","montant_cession","date"]},
  ]},
  {id:"risque-routier",icon:"🦺",label:"Risque Routier Professionnel",color:T.green,

   docs:[

    {id:"fiche-conducteur",label:"Fiche individuelle conducteur",fields:["nom_entreprise","nom_salarie","prenom_salarie","poste","service","permis_categorie","date_permis","points_permis","vehicule_attribue","km_annuels"]},
    {id:"attestation-formation-rr",label:"Attestation formation sécurité routière",fields:["nom_entreprise","nom_salarie","prenom_salarie","poste","date_formation","duree_formation","lieu_formation","organisme","formateur","contenu"]},
    {id:"analyse-risque",label:"Fiche d'analyse des risques routiers",fields:["nom_entreprise","service","responsable","trajet_type","frequence","niveau_risque","causes_identifiees","mesures","echeance"]},
    {id:"charte-conducteur",label:"Charte du conducteur responsable",fields:["nom_entreprise","directeur","responsable_securite","date"]},
    {id:"plan-prevention",label:"Plan de prévention routière annuel",fields:["nom_entreprise","directeur","responsable_securite","annee","nb_salaries_conducteurs","objectifs_annee","actions_prevues","budget_total","indicateurs"]},
    {id:"rapport-accident",label:"Rapport d'accident de mission",fields:["nom_entreprise","nom_salarie","prenom_salarie","date_accident","heure","lieu_accident","vehicule","degats_materiels","blesses","circumstances","mesures_correctives"]},
  ]},
  {id:"associations",icon:"🤝",label:"Associations & Collectifs",color:T.purple,
   desc:"Documents statutaires et administratifs pour associations loi 1901",
   docs:[
    {id:"statuts-asso",label:"Statuts d'association loi 1901",fields:["nom_asso","objet","siege_social","duree","ressources","admission","radiation","instances","dissolution","date_ag_constitutive"]},
    {id:"ri-asso",label:"Règlement intérieur",fields:["nom_asso","date_adoption","president","secretaire","modalites_adhesion","cotisation","droit_vote","discipline"]},
    {id:"pv-ca",label:"PV de Conseil d'Administration",fields:["nom_asso","date_ca","lieu","president","secretaire","membres_presents","ordre_du_jour","decisions","prochaine_reunion"]},
    {id:"convention-subvention",label:"Convention de subvention",fields:["organisme_financeur","representant","nom_asso","president_asso","adresse_asso","objet_subvention","montant","conditions_utilisation","duree","modalites_versement","date"]},
    {id:"bulletin-adhesion",label:"Bulletin d'adhésion",fields:["nom_asso","annee","nom_adherent","prenom_adherent","date_naissance_a","adresse_adherent","email","telephone_adherent","montant_cotisation"]},
    {id:"rapport-activite",label:"Rapport d'activité annuel",fields:["nom_asso","annee","president","nb_adherents","actions_realisees","bilan_financier","partenaires","perspectives"]},
  ]},
];

function genDoc(doc,fields,poleLabel){
  const today=new Date().toLocaleDateString("fr-FR");
  const g=k=>fields[k]||`[${k.replace(/_/g,' ')}]`;
  const sep="─".repeat(52);
  const tpl={
    "contrat-eleve":`CONTRAT DE FORMATION À LA CONDUITE — PERMIS B\n${sep}\n\nAUTO-ÉCOLE\n${g("nom_ecole")} — SIRET : ${g("siret_ecole")}\n${g("adresse_ecole")}\nMoniteur : ${g("moniteur")}\n\nÉLÈVE\n${g("prenom_eleve")} ${g("nom_eleve")} — Né(e) le ${g("date_naissance")}\n${g("adresse_eleve")} — Tél : ${g("telephone_eleve")}\n\nFORMATION\nFormule : ${g("formule")} | Heures : ${g("nb_heures")}h | Montant : ${g("montant")}€\nModalités de paiement : ${g("modalite_paiement")}\n\nARTICLES\nArt.1 – L'auto-école dispense la formation théorique et pratique convenue.\nArt.2 – L'élève respecte le règlement intérieur et les créneaux réservés.\nArt.3 – Toute annulation doit être signalée 48h à l'avance.\nArt.4 – En cas de résiliation, les heures non effectuées sont remboursées.\n\n${sep}\nFait le ${today}\n\nSignature élève :                 Signature moniteur :`,
    "recu-paiement":`REÇU DE PAIEMENT N° ${g("numero_recu")}\n${sep}\n\nAuto-école : ${g("nom_ecole")}\nDate : ${g("date")||today}\n\nJe soussigné(e) ${g("moniteur")} reconnais avoir reçu de :\n${g("prenom_eleve")} ${g("nom_eleve")}\n\nLa somme de : ${g("montant")} €\nPar : ${g("mode_paiement")}\nAu titre de : ${g("objet")}\n\n${sep}\nSignature et cachet :`,
    "attestation-heures":`ATTESTATION D'HEURES DE CONDUITE\n${sep}\n\nJe soussigné(e) ${g("moniteur")}, moniteur de conduite\nde l'auto-école ${g("nom_ecole")},\n\natteste que ${g("prenom_eleve")} ${g("nom_eleve")}\na effectué ${g("nb_heures")} heures de conduite\ndu ${g("date_debut")} au ${g("date_fin")}.\nType de formation : ${g("type_formation")}\n\nDélivrée pour faire valoir ce que de droit.\n${sep}\nFait le ${today}\n\nSignature et cachet :`,
    "contrat-prestation":`CONTRAT DE PRESTATION DE SERVICES\n${sep}\n\nPRESTATAIRE : ${g("prestataire")}\nSIRET : ${g("siret_presta")} | ${g("adresse_prestataire")}\n\nCLIENT : ${g("client")}\nSIRET : ${g("siret_client")} | ${g("adresse_client")}\n\nArt.1 – OBJET\n${g("objet_mission")}\n\nArt.2 – DURÉE\nDébut : ${g("date_debut")} — Durée : ${g("duree")}\n\nArt.3 – RÉMUNÉRATION\nMontant HT : ${g("montant_ht")}€ | TVA ${g("tva")}% : ${(parseFloat(fields.montant_ht||0)*parseFloat(fields.tva||0)/100).toFixed(2)}€\nTTC : ${(parseFloat(fields.montant_ht||0)*(1+parseFloat(fields.tva||0)/100)).toFixed(2)}€\nModalités : ${g("modalites_paiement")}\n\nArt.4 – CONFIDENTIALITÉ\nChaque partie s'engage à la stricte confidentialité.\n\nArt.5 – PÉNALITÉS\n${g("penalites")}\n\n${sep}\nFait en deux exemplaires, le ${today}\n\nSignature Prestataire :           Signature Client :`,
    "facture":`FACTURE N° ${g("numero_facture")}\n${sep}\n\n${g("prestataire")} — SIRET : ${g("siret_presta")}\n${g("adresse_prestataire")}\n\nFacturé à : ${g("client")} — ${g("adresse_client")}\nDate : ${g("date")||today} | Échéance : ${g("echeance")}\n\nDÉTAIL DES PRESTATIONS\n${sep}\n${g("prestations")}\n${sep}\nMontant HT     : ${g("montant_ht")} €\nTVA (${g("tva")}%)    : ${(parseFloat(fields.montant_ht||0)*parseFloat(fields.tva||0)/100).toFixed(2)} €\nTOTAL TTC      : ${(parseFloat(fields.montant_ht||0)*(1+parseFloat(fields.tva||0)/100)).toFixed(2)} €\n${sep}\nEn cas de retard : pénalités 3x taux légal + 40€ d'indemnité.`,
    "nda":`ACCORD DE CONFIDENTIALITÉ (NDA)\n${sep}\n\nEntre ${g("partie1")} (${g("adresse_p1")})\nET ${g("partie2")} (${g("adresse_p2")})\n\nArt.1 – OBJET : ${g("objet_confidentiel")}\n\nArt.2 – OBLIGATIONS\nChaque partie s'engage à ne pas divulguer les informations\néchangées et à les utiliser uniquement dans le cadre défini.\n\nArt.3 – DURÉE : ${g("duree_nda")}\n\nArt.4 – JURIDICTION : ${g("juridiction")}\n\n${sep}\nFait le ${g("date")||today}\n\nSignature ${g("partie1")} :         Signature ${g("partie2")} :`,
    "charte-conducteur":`CHARTE DU CONDUCTEUR RESPONSABLE\n${sep}\n${g("nom_entreprise").toUpperCase()}\n\nEn tant que conducteur professionnel, je m'engage à :\n\n✓ Respecter scrupuleusement le Code de la Route\n✓ Ne jamais téléphoner en conduisant\n✓ Ne jamais conduire sous l'emprise d'alcool ou de drogues\n✓ Adapter ma vitesse aux conditions de circulation\n✓ Porter systématiquement la ceinture de sécurité\n✓ Respecter les temps de repos réglementaires\n✓ Signaler tout défaut mécanique immédiatement\n✓ Refuser de conduire en état de fatigue\n✓ Effectuer la vérification du véhicule avant départ\n\nJe reconnais avoir pris connaissance de la politique\nde sécurité routière de l'entreprise.\n\n${sep}\nEntreprise : ${g("nom_entreprise")} | Direction : ${g("directeur")}\nResponsable sécurité : ${g("responsable_securite")}\nFait le ${g("date")||today}\n\nNom & signature du conducteur :    Date :`,
    "statuts-asso":`STATUTS — "${g("nom_asso").toUpperCase()}"\nAssociation loi 1er juillet 1901\n${sep}\n\nArt.1 – NOM : ${g("nom_asso")}\nArt.2 – OBJET : ${g("objet")}\nArt.3 – SIÈGE : ${g("siege_social")}\nArt.4 – DURÉE : ${g("duree")}\n\nArt.5 – ADMISSION\n${g("admission")}\n\nArt.6 – RADIATION\n${g("radiation")}\n\nArt.7 – RESSOURCES\n${g("ressources")}\n\nArt.8 – INSTANCES\n${g("instances")}\n\nArt.9 – DISSOLUTION\n${g("dissolution")}\n\n${sep}\nAdoptés en AG constitutive du ${g("date_ag_constitutive")}\nFait le ${today}\n\nPrésident(e) :                     Secrétaire :`,
    "convention-subvention":`CONVENTION DE SUBVENTION\n${sep}\n\nL'organisme financeur : ${g("organisme_financeur")}\nReprésenté par : ${g("representant")}\n\nEt l'association : ${g("nom_asso")}\nReprésentée par : ${g("president_asso")}\nAdresse : ${g("adresse_asso")}\n\nArt.1 – OBJET DE LA SUBVENTION\n${g("objet_subvention")}\n\nArt.2 – MONTANT : ${g("montant")} €\n\nArt.3 – CONDITIONS D'UTILISATION\n${g("conditions_utilisation")}\n\nArt.4 – DURÉE : ${g("duree")}\n\nArt.5 – MODALITÉS DE VERSEMENT\n${g("modalites_versement")}\n\n${sep}\nFait le ${g("date")||today}\n\nPour l'organisme :                Pour l'association :`,
  };
  return tpl[doc.id]||`${doc.label.toUpperCase()}\n${sep}\nPôle : ${poleLabel}\nDate : ${today}\n\n${Object.entries(fields).filter(([,v])=>v).map(([k,v])=>`${k.replace(/_/g,' ')} : ${v}`).join("\n")}\n\n${sep}\nDocument généré via Doc Express — Maya Pro Drive`;
}

function Header({user,credits,onAI,onReset,S,T}){
  return(
    <div style={{background:`linear-gradient(135deg,${T.bg2},#0A1020)`,borderBottom:`1px solid ${T.border}`,padding:"13px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={onReset}>
        <div style={{width:36,height:36,background:T.grad,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:900,color:"#fff",fontFamily:"'Syne',sans-serif"}}>D</div>
        <div>
          <div style={{fontSize:18,fontWeight:800,fontFamily:"'Syne',sans-serif",letterSpacing:"-0.5px"}}>Doc Express</div>
          <div style={{fontSize:9,color:T.muted,letterSpacing:"2px",textTransform:"uppercase"}}>by Maya Pro Drive</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        {user&&<div style={{background:`${T.accent}20`,border:`1px solid ${T.accent}40`,color:T.accent,padding:"5px 14px",borderRadius:20,fontSize:13,fontWeight:700}}>🎟 {credits} crédit{credits!==1?"s":""}</div>}
        <button style={{background:`linear-gradient(135deg,${T.purple},${T.purple}DD)`,color:"#fff",border:"none",borderRadius:10,padding:"8px 16px",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}} onClick={onAI}>✨ IA</button>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState("landing");
  const [user,setUser]=useState(null);
  const [credits,setCredits]=useState(0);
  const [pole,setPole]=useState(null);
  const [doc,setDoc]=useState(null);
  const [form,setForm]=useState({});
  const [preview,setPreview]=useState("");
  const [copied,setCopied]=useState(false);
  const [plan,setPlan]=useState("unit");
  const [fade,setFade]=useState(false);
  const [regName,setRegName]=useState("");
  const [regEmail,setRegEmail]=useState("");
  const [regPwd,setRegPwd]=useState("");
  const [aiPrompt,setAiPrompt]=useState("");
  const [aiResult,setAiResult]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [aiError,setAiError]=useState("");
  const [aiCopied,setAiCopied]=useState(false);

  const go=s=>{setFade(true);setTimeout(()=>{setScreen(s);setFade(false);},180);};
  const register=()=>{if(!regName||!regEmail)return;setUser({name:regName,email:regEmail});setCredits(10);go("home");};
  const selPole=p=>{setPole(p);setDoc(null);setForm({});go("pole");};
  const selDoc=d=>{setDoc(d);setForm({});go("form");};
  const setField=(k,v)=>setForm(p=>({...p,[k]:v}));
  const generate=()=>{const txt=genDoc(doc,form,pole.label);setPreview(txt);if(credits>0){setCredits(c=>c-1);go("preview");}else{go("locked");}};
  const pay=()=>{go("preview");};
  const copy=()=>{navigator.clipboard.writeText(preview);setCopied(true);setTimeout(()=>setCopied(false),2000);};
  const download=()=>{const b=new Blob([preview],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`${doc?.label||"document"}.txt`;a.click();};
  const reset=()=>{setPole(null);setDoc(null);setForm({});setPreview("");go("home");};
  const filled=Object.values(form).filter(Boolean).length;
  const total=doc?.fields?.length||1;
  const prog=Math.round(filled/total*100);

  const generateWithAI=async()=>{
    if(!aiPrompt.trim())return;
    setAiLoading(true);setAiError("");setAiResult("");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          system:`Tu es un expert juridique et administratif français. Génère des documents professionnels complets, structurés et prêts à l'emploi. Utilise des séparateurs ─ pour la mise en forme. Commence directement par le titre sans introduction.`,
          messages:[{role:"user",content:`Génère ce document professionnel :\n\n${aiPrompt}`}]
        })
      });
      const data=await res.json();
      if(data.content?.[0]?.text){setAiResult(data.content[0].text);if(credits>0)setCredits(c=>c-1);}
      else setAiError("Erreur lors de la génération. Réessayez.");
    }catch(e){setAiError("Erreur de connexion.");}
    setAiLoading(false);
  };
  const downloadAI=()=>{const b=new Blob([aiResult],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="document-ia.txt";a.click();};
  const copyAI=()=>{navigator.clipboard.writeText(aiResult);setAiCopied(true);setTimeout(()=>setAiCopied(false),2000);};

  const S={
    wrap:{opacity:fade?0:1,transition:"opacity 0.18s",maxWidth:920,margin:"0 auto",padding:"28px 20px 70px"},
    card:{background:T.card,border:`1px solid ${T.border}`,borderRadius:18,padding:26,marginBottom:18},
    card2:{background:T.card2,border:`1px solid ${T.border2}`,borderRadius:18,padding:26,marginBottom:18},
    btn:c=>({background:`linear-gradient(135deg,${c},${c}CC)`,color:"#fff",border:"none",borderRadius:11,padding:"12px 22px",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",display:"inline-flex",alignItems:"center",gap:8}),
    btnO:c=>({background:"transparent",color:c,border:`1.5px solid ${c}40`,borderRadius:11,padding:"11px 20px",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}),
    btnSec:{background:T.bg2,color:T.muted,border:`1px solid ${T.border}`,borderRadius:11,padding:"12px 18px",fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"},
    back:{background:"none",border:"none",color:T.muted,cursor:"pointer",fontSize:14,fontWeight:500,padding:"6px 0",marginBottom:20,display:"inline-flex",alignItems:"center",gap:6,fontFamily:"'DM Sans',sans-serif"},
    sec:{fontSize:11,fontWeight:700,color:T.dim,letterSpacing:"3px",textTransform:"uppercase",marginBottom:14},
    input:{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:"11px 14px",color:T.text,fontSize:14,width:"100%",outline:"none",transition:"border-color 0.2s"},
    textarea:{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:"12px 14px",color:T.text,fontSize:14,width:"100%",outline:"none",resize:"vertical",minHeight:130,lineHeight:1.6},
    pre:{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:14,padding:20,fontFamily:"monospace",fontSize:13,color:T.muted,whiteSpace:"pre-wrap",lineHeight:1.75,marginBottom:18,maxHeight:420,overflowY:"auto"},
    label:{fontSize:12,fontWeight:600,color:T.muted,marginBottom:5,display:"block"},
  };

  // LANDING
  if(screen==="landing") return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <div style={{position:"fixed",top:-200,right:-150,width:500,height:500,borderRadius:"50%",background:`radial-gradient(circle,${T.accent}07,transparent 70%)`,pointerEvents:"none"}}/>
      <div style={{position:"fixed",bottom:-150,left:-100,width:450,height:450,borderRadius:"50%",background:`radial-gradient(circle,${T.blue}07,transparent 70%)`,pointerEvents:"none"}}/>
      <div style={{maxWidth:920,margin:"0 auto",padding:"0 20px"}}>
        <nav style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 0",borderBottom:`1px solid ${T.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:38,height:38,background:T.grad,borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,fontWeight:900,color:"#fff",fontFamily:"'Syne',sans-serif"}}>D</div>
            <div>
              <div style={{fontSize:19,fontWeight:800,fontFamily:"'Syne',sans-serif",letterSpacing:"-0.5px"}}>Doc Express</div>
              <div style={{fontSize:10,color:T.muted,letterSpacing:"2px",textTransform:"uppercase"}}>by Maya Pro Drive</div>
            </div>
          </div>
          <button style={S.btn(T.accent)} onClick={()=>go("register")}>Commencer gratuitement →</button>
        </nav>
        <div style={{textAlign:"center",padding:"70px 0 50px"}}>
          <div style={{background:`${T.green}20`,border:`1px solid ${T.green}40`,color:T.green,padding:"5px 16px",borderRadius:20,fontSize:13,fontWeight:600,display:"inline-block",marginBottom:22}}>✨ 10 documents offerts à l'inscription</div>
          <h1 style={{fontSize:"clamp(30px,5.5vw,56px)",fontWeight:800,fontFamily:"'Syne',sans-serif",letterSpacing:"-2px",lineHeight:1.05,marginBottom:18}}>
            Vos documents professionnels,<br/>
            <span style={{background:T.grad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>générés en 30 secondes.</span>
          </h1>
          <p style={{fontSize:17,color:T.muted,maxWidth:540,margin:"0 auto 36px",lineHeight:1.65}}>
            Contrats, conventions, attestations, devis — personnalisés et prêts à signer. Plus une IA qui crée n'importe quel document sur mesure.
          </p>
          <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
            <button style={{...S.btn(T.accent),padding:"14px 30px",fontSize:15}} onClick={()=>go("register")}>🚀 Créer mon compte gratuit</button>
            <button style={{...S.btnO(T.muted),padding:"13px 24px"}} onClick={()=>go("home")}>Voir la démo</button>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14,marginBottom:50}}>
          {[["30+","Documents"],["4","Pôles métier"],["1€","Par document"],["IA","Génération libre"]].map(([n,l])=>(
            <div key={l} style={{...S.card,textAlign:"center",padding:22}}>
              <div style={{fontSize:30,fontWeight:800,fontFamily:"'Syne',sans-serif",color:T.accent,letterSpacing:"-1px"}}>{n}</div>
              <div style={{fontSize:13,color:T.muted,marginTop:3}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={S.sec}>Domaines couverts</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(195px,1fr))",gap:12,marginBottom:50}}>
          {POLES.map(p=>(
            <div key={p.id} style={{...S.card,overflow:"hidden",position:"relative",cursor:"pointer"}} onClick={()=>go("register")}>
              <div style={{position:"absolute",top:-20,right:-20,width:70,height:70,borderRadius:"50%",background:`${p.color}15`,filter:"blur(15px)"}}/>
              <div style={{fontSize:28,marginBottom:8}}>{p.icon}</div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:4,fontFamily:"'Syne',sans-serif"}}>{p.label}</div>
              <div style={{fontSize:12,color:T.muted}}>{p.docs.length} documents disponibles</div>
            </div>
          ))}
        </div>
        <div style={S.sec}>Tarifs</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))",gap:14,marginBottom:50}}>
          {[{l:"Gratuit",p:"0€",s:"à l'inscription",items:["10 documents offerts","Tous les modèles","Téléchargement .txt"],f:false},
            {l:"À l'unité",p:"1€",s:"par document",items:["Sans abonnement","Accès immédiat","Toutes catégories"],f:false},
            {l:"Abonnement",p:"9€",s:"/mois · illimité",items:["Illimité","IA générative incluse","Export Word & PDF"],f:true,b:"Meilleure offre"}
          ].map(x=>(
            <div key={x.l} style={{background:x.f?`${T.accent}12`:T.card,border:`1.5px solid ${x.f?T.accent:T.border}`,borderRadius:16,padding:24,position:"relative"}}>
              {x.b&&<div style={{position:"absolute",top:-11,left:"50%",transform:"translateX(-50%)",background:T.accent,color:"#fff",fontSize:11,fontWeight:700,padding:"3px 12px",borderRadius:20,whiteSpace:"nowrap"}}>{x.b}</div>}
              <div style={{fontSize:13,fontWeight:700,color:T.muted,marginBottom:6}}>{x.l}</div>
              <div style={{fontSize:34,fontWeight:800,fontFamily:"'Syne',sans-serif",color:x.f?T.accent:T.text,letterSpacing:"-1px",marginBottom:3}}>{x.p}</div>
              <div style={{fontSize:12,color:T.dim,marginBottom:16}}>{x.s}</div>
              {x.items.map(i=><div key={i} style={{fontSize:13,color:T.muted,marginBottom:5}}>✓ {i}</div>)}
            </div>
          ))}
        </div>
        <div style={{textAlign:"center",paddingBottom:60}}>
          <button style={{...S.btn(T.accent),padding:"14px 34px",fontSize:15}} onClick={()=>go("register")}>Commencer — c'est gratuit →</button>
        </div>
      </div>
    </div>
  );

  // INSCRIPTION
  if(screen==="register") return(
    <div style={{background:T.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
      <div style={{width:"100%",maxWidth:420}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{width:50,height:50,background:T.grad,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:900,color:"#fff",fontFamily:"'Syne',sans-serif",margin:"0 auto 14px"}}>D</div>
          <h2 style={{fontSize:24,fontWeight:800,fontFamily:"'Syne',sans-serif",letterSpacing:"-0.5px",marginBottom:8}}>Créez votre compte</h2>
          <p style={{color:T.muted,fontSize:14}}>et recevez <strong style={{color:T.accent}}>10 documents offerts</strong></p>
        </div>
        <div style={S.card}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div><label style={S.label}>Votre nom</label><input style={S.input} value={regName} onChange={e=>setRegName(e.target.value)} placeholder="ex : Chrystel Maya" onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=T.border}/></div>
            <div><label style={S.label}>Email</label><input style={S.input} type="email" value={regEmail} onChange={e=>setRegEmail(e.target.value)} placeholder="votre@email.com" onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=T.border}/></div>
            <div><label style={S.label}>Mot de passe</label><input style={S.input} type="password" value={regPwd} onChange={e=>setRegPwd(e.target.value)} placeholder="••••••••" onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=T.border}/></div>
            <button style={{...S.btn(T.accent),justifyContent:"center",padding:"13px",marginTop:4}} onClick={register}>🎉 Créer mon compte — 10 docs gratuits</button>
          </div>
          <div style={{textAlign:"center",marginTop:14,fontSize:12,color:T.dim}}>Aucune carte bancaire requise.</div>
        </div>
        <button style={S.back} onClick={()=>go("landing")}>← Retour</button>
      </div>
    </div>
  );

  // HOME
  if(screen==="home") return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        {user&&<div style={{...S.card2,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:24}}>
          <div>
            <div style={{fontSize:17,fontWeight:700,fontFamily:"'Syne',sans-serif"}}>Bonjour {user.name.split(" ")[0]} 👋</div>
            <div style={{fontSize:13,color:T.muted,marginTop:2}}>Vous avez <strong style={{color:T.accent}}>{credits} document{credits!==1?"s":""}</strong> gratuit{credits!==1?"s":""} disponible{credits!==1?"s":""}</div>
          </div>
          <button style={S.btn(T.purple)} onClick={()=>go("ai")}>✨ Générer avec l'IA</button>
        </div>}
        <div style={S.sec}>Choisissez votre domaine</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(205px,1fr))",gap:13,marginBottom:36}}>
          {POLES.map(p=>(
            <div key={p.id} style={{...S.card,position:"relative",overflow:"hidden",cursor:"pointer",transition:"all 0.18s"}}
              onClick={()=>selPole(p)}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=p.color;e.currentTarget.style.transform="translateY(-3px)";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.transform="translateY(0)";}}>
              <div style={{position:"absolute",top:-25,right:-25,width:80,height:80,borderRadius:"50%",background:`${p.color}15`,filter:"blur(18px)"}}/>
              <div style={{fontSize:30,marginBottom:9}}>{p.icon}</div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:5,fontFamily:"'Syne',sans-serif"}}>{p.label}</div>
              <div style={{fontSize:12,color:T.muted,lineHeight:1.5,marginBottom:11}}>{p.desc}</div>
              <div style={{color:p.color,fontSize:12,fontWeight:600}}>{p.docs.length} documents →</div>
            </div>
          ))}
        </div>
        <div style={{background:`linear-gradient(135deg,${T.purple}15,${T.blue}08)`,border:`1px solid ${T.purple}25`,borderRadius:16,padding:24,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14}}>
          <div>
            <div style={{fontSize:17,fontWeight:700,fontFamily:"'Syne',sans-serif",marginBottom:5}}>✨ Document non listé ?</div>
            <div style={{fontSize:13,color:T.muted}}>Notre IA génère n'importe quel document sur votre description.</div>
          </div>
          <button style={S.btn(T.purple)} onClick={()=>go("ai")}>Essayer l'IA →</button>
        </div>
      </div>
    </div>
  );

  // POLE
  if(screen==="pole"&&pole) return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        <button style={S.back} onClick={()=>go("home")}>← Retour</button>
        <div style={{display:"flex",alignItems:"center",gap:13,marginBottom:24}}>
          <div style={{fontSize:36}}>{pole.icon}</div>
          <div>
            <h2 style={{fontSize:21,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>{pole.label}</h2>
            <div style={{fontSize:13,color:T.muted}}>{pole.desc}</div>
          </div>
        </div>
        <div style={S.sec}>Sélectionnez un document</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {pole.docs.map(d=>(
            <div key={d.id} style={{...S.card,display:"flex",alignItems:"center",gap:13,cursor:"pointer",transition:"all 0.16s",padding:"14px 18px"}}
              onClick={()=>selDoc(d)}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=pole.color;e.currentTarget.style.transform="translateX(4px)";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.transform="translateX(0)";}}>
              <div style={{width:9,height:9,borderRadius:"50%",background:pole.color,flexShrink:0}}/>
              <span style={{flex:1,fontSize:14,fontWeight:500}}>{d.label}</span>
              <span style={{color:T.dim,fontSize:17}}>›</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  // FORM
  if(screen==="form"&&doc&&pole) return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        <button style={S.back} onClick={()=>go("pole")}>← {pole.label}</button>
        <div style={S.card}>
          <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:4}}>
            <div style={{width:11,height:11,borderRadius:"50%",background:pole.color}}/>
            <h2 style={{fontSize:18,fontWeight:700,fontFamily:"'Syne',sans-serif"}}>{doc.label}</h2>
          </div>
          <div style={{fontSize:13,color:T.muted,marginBottom:20}}>Remplissez les champs pour personnaliser votre document.</div>
          <div style={{height:4,background:T.border,borderRadius:4,marginBottom:22,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${prog}%`,background:pole.color,borderRadius:4,transition:"width 0.3s"}}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(195px,1fr))",gap:13}}>
            {doc.fields.map(k=>(
              <div key={k}>
                <label style={S.label}>{k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</label>
                <input style={S.input} value={form[k]||""} onChange={e=>setField(k,e.target.value)} placeholder={k.replace(/_/g,' ')}
                  onFocus={e=>e.target.style.borderColor=pole.color} onBlur={e=>e.target.style.borderColor=T.border}/>
              </div>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:11,flexWrap:"wrap",alignItems:"center"}}>
          <button style={S.btn(pole.color)} onClick={generate}>
            {credits>0?`✨ Générer (${credits} crédit${credits!==1?"s":""} gratuit${credits!==1?"s":""})`:"✨ Générer le document"}
          </button>
          <button style={S.btnSec} onClick={()=>go("pole")}>Annuler</button>
          {credits>0&&<span style={{fontSize:12,color:T.green}}>✓ Gratuit pour vous</span>}
        </div>
      </div>
    </div>
  );

  // LOCKED
  if(screen==="locked") return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        <div style={{...S.card,textAlign:"center",padding:38}}>
          <div style={{fontSize:50,marginBottom:14}}>🔒</div>
          <h2 style={{fontSize:21,fontWeight:800,fontFamily:"'Syne',sans-serif",marginBottom:8}}>Votre document est prêt !</h2>
          <p style={{fontSize:14,color:T.muted,marginBottom:28,lineHeight:1.6}}>Vos crédits gratuits sont épuisés.<br/>Choisissez une option pour accéder au document.</p>
          <div style={{display:"flex",justifyContent:"center",gap:13,marginBottom:26,flexWrap:"wrap"}}>
            {[{id:"unit",l:"Document à l'unité",p:"1€"},{id:"sub",l:"Abonnement mensuel",p:"9€/mois"}].map(x=>(
              <div key={x.id} style={{background:plan===x.id?`${T.accent}15`:T.bg2,border:`2px solid ${plan===x.id?T.accent:T.border}`,borderRadius:13,padding:"15px 20px",cursor:"pointer",textAlign:"center",minWidth:135,transition:"all 0.15s"}} onClick={()=>setPlan(x.id)}>
                <div style={{fontSize:24,fontWeight:800,fontFamily:"'Syne',sans-serif",color:plan===x.id?T.accent:T.text}}>{x.p}</div>
                <div style={{fontSize:12,color:T.muted,marginTop:3}}>{x.l}</div>
              </div>
            ))}
          </div>
          <button style={{...S.btn(T.accent),padding:"13px 26px",justifyContent:"center"}} onClick={pay}>💳 Payer et accéder</button>
          <div style={{fontSize:12,color:T.dim,marginTop:12}}>Paiement sécurisé via Stripe · Accès immédiat</div>
        </div>
        <div style={{position:"relative"}}>
          <div style={{...S.pre,filter:"blur(5px)",userSelect:"none",pointerEvents:"none"}}>{preview}</div>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(7,11,20,0.55)",borderRadius:14}}><div style={{fontSize:44}}>🔒</div></div>
        </div>
      </div>
    </div>
  );

  // PREVIEW
  if(screen==="preview") return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        <button style={S.back} onClick={reset}>← Nouveau document</button>
        <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:20,background:`${T.green}10`,border:`1px solid ${T.green}25`,borderRadius:11,padding:"11px 16px"}}>
          <span>✅</span>
          <div>
            <div style={{fontWeight:700,color:T.green,fontSize:14}}>Document généré avec succès</div>
            <div style={{fontSize:12,color:T.muted}}>Il reste <strong style={{color:T.accent}}>{credits} crédit{credits!==1?"s":""}</strong> sur votre compte</div>
          </div>
        </div>
        <div style={{fontSize:17,fontWeight:700,fontFamily:"'Syne',sans-serif",marginBottom:3}}>{doc?.label}</div>
        <div style={{fontSize:13,color:T.muted,marginBottom:14}}>{pole?.label}</div>
        <div style={S.pre}>{preview}</div>
        <div style={{display:"flex",gap:11,flexWrap:"wrap"}}>
          <button style={S.btn(T.accent)} onClick={download}>⬇️ Télécharger (.txt)</button>
          <button style={S.btn(T.blue)} onClick={copy}>{copied?"✅ Copié !":"📋 Copier"}</button>
          <button style={S.btnSec} onClick={reset}>Nouveau document</button>
        </div>
        <div style={{marginTop:16,fontSize:12,color:T.dim}}>💡 Export Word (.docx) et PDF disponible dans la version complète.</div>
      </div>
    </div>
  );

  // IA
  if(screen==="ai") return(
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <Header user={user} credits={credits} onAI={()=>go("ai")} onReset={()=>go("home")} S={S} T={T}/>
      <div style={S.wrap}>
        <button style={S.back} onClick={()=>go("home")}>← Retour</button>
        <div style={{display:"flex",alignItems:"center",gap:13,marginBottom:26}}>
          <div style={{width:48,height:48,background:`linear-gradient(135deg,${T.purple},${T.blue})`,borderRadius:13,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>✨</div>
          <div>
            <h2 style={{fontSize:21,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>Génération IA</h2>
            <div style={{fontSize:13,color:T.muted}}>Décrivez votre document — l'IA le génère pour vous.</div>
          </div>
        </div>
        <div style={S.card}>
          <label style={S.label}>Décrivez le document souhaité</label>
          <textarea style={{...S.textarea,marginBottom:14,borderColor:aiPrompt?T.purple:T.border}}
            value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)}
            placeholder={"Exemples :\n• \"Un contrat de location de véhicule, 3 jours à 45€/jour\"\n• \"Une lettre de démission avec préavis de 2 mois\"\n• \"Un règlement intérieur pour une salle de sport associative\""}
            onFocus={e=>e.target.style.borderColor=T.purple} onBlur={e=>e.target.style.borderColor=aiPrompt?T.purple:T.border}/>
          <div style={{display:"flex",gap:11,alignItems:"center",flexWrap:"wrap"}}>
            <button style={{...S.btn(T.purple),opacity:aiLoading||!aiPrompt.trim()?0.5:1,cursor:aiLoading||!aiPrompt.trim()?"not-allowed":"pointer"}}
              onClick={generateWithAI} disabled={aiLoading||!aiPrompt.trim()}>
              {aiLoading?<><span className="spin">⟳</span> Génération en cours...</>:"✨ Générer avec l'IA"}
            </button>
            {user&&<span style={{fontSize:12,color:T.muted}}>{credits} crédit{credits!==1?"s":""} disponible{credits!==1?"s":""}</span>}
          </div>
          {aiError&&<div style={{marginTop:12,padding:"9px 13px",background:"#FF444418",border:"1px solid #FF444435",borderRadius:9,fontSize:13,color:"#FF7070"}}>{aiError}</div>}
        </div>

        {!aiResult&&!aiLoading&&(
          <div>
            <div style={S.sec}>Idées de documents</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:9}}>
              {["Un contrat de location de salle pour événement","Une lettre de recommandation professionnelle","Un accord de prêt entre particuliers pour 2000€","Un contrat de bénévolat pour une association","Un contrat de cession de véhicule entre particuliers","Une promesse d'embauche pour un poste de commercial"].map(ex=>(
                <div key={ex} style={{...S.card,padding:"12px 15px",cursor:"pointer",fontSize:13,color:T.muted,transition:"all 0.15s"}}
                  onClick={()=>setAiPrompt(ex)}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=T.purple;e.currentTarget.style.color=T.text;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;}}>
                  💬 {ex}
                </div>
              ))}
            </div>
          </div>
        )}

        {aiResult&&(
          <div>
            <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14,padding:"9px 14px",background:`${T.green}10`,border:`1px solid ${T.green}25`,borderRadius:9}}>
              <span>✅</span><span style={{fontSize:14,color:T.green,fontWeight:600}}>Document généré par l'IA</span>
            </div>
            <div style={S.pre}>{aiResult}</div>
            <div style={{display:"flex",gap:11,flexWrap:"wrap",marginBottom:14}}>
              <button style={S.btn(T.accent)} onClick={downloadAI}>⬇️ Télécharger (.txt)</button>
              <button style={S.btn(T.blue)} onClick={copyAI}>{aiCopied?"✅ Copié !":"📋 Copier"}</button>
              <button style={S.btnSec} onClick={()=>{setAiResult("");setAiPrompt("");}}>Nouveau</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
